<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Wolf - PIN</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Roboto, "Helvetica Neue", Arial, sans-serif;
            background: rgb(114, 0, 130);
            background: linear-gradient(132deg, rgba(114, 0, 130, 1) 0%, rgba(63, 0, 195, 1) 50%, rgba(0, 71, 255, 1) 100%);
        }

        form {
            display: flex;
            justify-content: center;
            color: white;
        }

        input {
            margin: 0 0.5rem;
            padding: 0.5rem;
            border: 1px solid white;
            width: 50px;
            height: 50px;
            text-align: center;
            font-size: 3rem;
        }

        /* Chrome, Safari, Edge, Opera */
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        /* Firefox */
        input[type=number] {
            -moz-appearance: textfield;
        }

        .pending {
            color: white;
            text-align: center;
        }

        .user {
            display: block;
            margin-bottom: 1rem;
            color: white;
            text-align: center;
            font-size: 1.5rem;
        }

        .user[hidden], form[hidden] {
            display: none;
        }

        .user select {
            font-size: 1.5rem;
        }

        .pending a {
            display: block;
            margin: 0.5rem;
            color: white;
        }
    </style>
</head>
<body>


<div>
    <div class="pending" hidden></div>
    <label class="user" hidden>
        Pair as
        <select></select>
    </label>
    <form class="form" hidden>
        <input type="number" min="0" max="9" step="1"/>
        <input type="number" min="0" max="9" step="1"/>
        <input type="number" min="0" max="9" step="1"/>
        <input type="number" min="0" max="9" step="1"/>
    </form>
</div>


</body>
<script type="application/javascript">
    const inputs = document.querySelectorAll("input");
    const form = document.querySelector(".form");
    const pending = document.querySelector(".pending");
    const userPicker = document.querySelector(".user");
    const userSelect = userPicker.querySelector("select");

    function showPinForm() {
        fetch("/pin/users")
            .then((response) => response.json())
            .then((users) => {
                if (users.length === 0) {
                    pending.hidden = false;
                    pending.textContent = "No users exist yet. Create a User resource, then reload this page.";
                    return;
                }
                users.forEach((user) => userSelect.add(new Option(user, user)));
                pending.hidden = true;
                userPicker.hidden = false;
                form.hidden = false;
                inputs[0].focus();
            })
            .catch((err) => {
                pending.hidden = false;
                pending.textContent = "Failed to load users: " + err;
            });
    }

    function showPendingRequests(requests) {
        pending.hidden = false;
        if (requests.length === 0) {
            pending.textContent = "No pending pairing requests. Start pairing in Moonlight, then reload this page.";
            return;
        }
        pending.textContent = "Pick the client you are pairing:";
        requests.forEach((request) => {
            const link = document.createElement("a");
            link.href = "#" + request.secret;
            link.textContent = request.clientIP + " (" + new Date(request.requestedAt).toLocaleTimeString() + ")";
            link.addEventListener("click", () => setTimeout(showPinForm));
            pending.appendChild(link);
        });
    }

    function loadPendingRequests() {
        fetch("/pin/pending")
            .then((response) => response.json())
            .then((requests) => {
                if (requests.length === 1) {
                    window.location.hash = requests[0].secret;
                    showPinForm();
                    return;
                }
                showPendingRequests(requests);
            })
            .catch((err) => {
                pending.hidden = false;
                pending.textContent = "Failed to load pending pairing requests: " + err;
            });
    }

    function send(pin) {
        let xhr = new XMLHttpRequest();
        xhr.open("POST", "/pin/", true);
        xhr.setRequestHeader("Content-Type", "application/json");
        xhr.onreadystatechange = function () {
            if (xhr.readyState === 4) {
                form.textContent = xhr.responseText;
            }
        };
        const data = JSON.stringify({
            "pin": pin,
            "secret": window.location.hash.substring(1),
            "user": userSelect.value
        });
        userPicker.hidden = true;
        form.textContent = "Sending " + pin + " ...";
        xhr.send(data);
    }

    inputs.forEach((input, key) => {
        input.addEventListener("keyup", function (ev) {
            if (ev.key === "Backspace" && key > 0) {
                inputs[key - 1].focus();
            }
            if (input.value) {
                if (key === 3) {
                    const userCode = [...inputs].map((input) => input.value).join("");
                    send(userCode);
                    [...inputs].forEach((input) => input.remove());
                } else {
                    inputs[key + 1].focus();
                }
            }
        });
    });
    if (window.location.hash.length > 1) {
        showPinForm();
    } else {
        loadPendingRequests();
    }
</script>
</html>
